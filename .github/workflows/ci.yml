# CI GarageOS — gratuita (repo pubblico). Nessun segreto, nessun accesso alla produzione: solo emulatori.
# Le suite sui DATI REALI (prod-data, first-open, costs) restano locali: i backup con dati personali non vanno mai su GitHub.
name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: CSP e versione del service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: CSP (hash degli script inline, o script-src 'self' senza inline)
        run: node tools/csp-hash.mjs --check
      - name: PRECACHE del service worker completo (css/ e js/)
        run: node tools/check-precache.mjs
      - name: Unit test dei moduli puri
        run: node --test tests/unit/modules.test.mjs tests/unit/ics.test.mjs tests/unit/legacy-banner.test.mjs
      - name: VERSION del service worker incrementata (solo PR che toccano file dell'app)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(index\.html|sw\.js|manifest\.json|icon-.*\.png|favicon\.ico|css/.*|js/.*)$'; then
            old=$(git show "$base":sw.js | grep -o "VERSION = '[^']*'")
            new=$(grep -o "VERSION = '[^']*'" sw.js)
            echo "base: $old · PR: $new"
            if [ "$old" = "$new" ]; then
              echo "::error file=sw.js::File dell'app modificati ma VERSION invariata ($old): i client non si aggiornerebbero."
              exit 1
            fi
          else
            echo "Nessun file dell'app modificato."
          fi

  rules:
    name: Regole Firestore (emulatore)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - run: npm ci
      - name: Test delle regole
        run: npm test
      # test:audit NON è qui: descrive il flusso inviti della v2.1 e fallisce di proposito con le regole attuali

  e2e:
    name: E2E (CSP, PWA/offline) su emulatori
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # upgrade.e2e confronta con la versione in produzione (main)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6   # pwa.e2e avvia "python -m http.server"
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: |
          npm ci --prefix tests/rules
          npm ci --prefix tests/e2e
          npm ci --prefix tools/admin
      - name: Emulatori auth + firestore
        run: |
          tests/rules/node_modules/.bin/firebase emulators:start --only auth,firestore --project garageos-879bc > emulators.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && curl -sf http://127.0.0.1:9099/ >/dev/null && exit 0
            sleep 2
          done
          cat emulators.log; exit 1
      - name: CSP e flussi principali
        run: |
          python -m http.server 5173 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e/csp.e2e.mjs
      - name: Calendario .ics
        run: node tests/e2e/calendar.e2e.mjs
      - name: Avviso "vecchia icona" (arrivo dalla v1)
        run: node tests/e2e/legacy-banner.e2e.mjs
      - name: Service worker e offline
        run: node tests/e2e/pwa.e2e.mjs
      - name: Aggiornamento dalla versione in produzione
        run: node tests/e2e/upgrade.e2e.mjs origin/main
      - name: Log degli emulatori
        if: failure()
        run: cat emulators.log
